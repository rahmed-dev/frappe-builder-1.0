# Implement Feature Workflow
name: implement-feature
description: "Implement feature from Technical Specification with production-ready Frappe code"
author: "frappe-builder"

# Config source pattern
config_source: "{project-root}/.bmad/frappe-builder/config.yaml"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
document_output_language: "{config_source}:document_output_language"
output_folder: "{config_source}:output_folder"
frappe_bench_path: "{config_source}:frappe_bench_path"
default_site: "{config_source}:default_site"
date: system-generated

# Workflow paths
installed_path: "{project-root}/.bmad/frappe-builder/workflows/implement-feature"
instructions: "{installed_path}/instructions.md"
template: false  # Action workflow - generates code, not documents

# Input
recommended_inputs:
  - tsd: "{{docs_path}}/tsd/"
  - implementation_plan: "{{docs_path}}/implementation-plans/"

input_file_patterns:
  tsd:
    whole: "{{docs_path}}/tsd/*.md"
    sharded: "{{docs_path}}/tsd/*/index.md"
  implementation_plan:
    whole: "{{docs_path}}/implementation-plans/*.md"
    sharded: "{{docs_path}}/implementation-plans/*/index.md"

standalone: true
